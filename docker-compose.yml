services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: scheduler
    ports:
      - "5433:5432"
    volumes:
      - pgdata_new:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://reachinbox:password123@postgres:5432/scheduler?schema=public
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MAX_EMAILS_PER_HOUR_PER_SENDER=50
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
    depends_on:
      - postgres
      - redis
      - elasticsearch

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata_new:
  redisdata: