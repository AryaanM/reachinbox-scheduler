services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: scheduler
    ports:
      # Changed host port to 5433 to avoid local conflicts
      - "5433:5432"
    volumes:
      # Changed volume name to force a clean database initialization
      - pgdata_new:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

volumes:
  pgdata_new:
  redisdata: