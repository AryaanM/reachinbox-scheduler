apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: reachinbox-backend:local
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "4000"
        - name: DATABASE_URL
          value: "postgresql://reachinbox:password123@postgres:5432/scheduler?schema=public"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch:9200"
        - name: MAX_EMAILS_PER_HOUR_PER_SENDER
          value: "50"
        - name: MIN_DELAY_BETWEEN_EMAILS_MS
          value: "2000"
        ports:
        - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 4000
    targetPort: 4000